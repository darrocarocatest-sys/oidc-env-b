name: envprobe
on:
  push:
    branches:
      - '**'
    tags:
      - '**'
permissions:
  id-token: write
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: mint
        run: |
          set -uo pipefail
          echo "---REF--- $GITHUB_REF type=$GITHUB_REF_TYPE name=$GITHUB_REF_NAME"
          echo "---URLPRESENT--- ${ACTIONS_ID_TOKEN_REQUEST_URL:+YES}"
          curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=envprobe" -o /tmp/t.json
          python3 - <<'PY'
          import json, base64
          v = json.load(open('/tmp/t.json')).get('value','')
          print("::add-mask::" + v)
          p = v.split('.')[1]
          c = json.loads(base64.urlsafe_b64decode(p + '=='))
          print("---SUB---", c.get('sub'))
          print("---ENV---", c.get('environment'))
          print("---REFCLAIM---", c.get('ref'), c.get('ref_type'), 'protected=' + str(c.get('ref_protected')))
          print("---FULL---", json.dumps(c, sort_keys=True))
          PY
          echo "---DONE---"
