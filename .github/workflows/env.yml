name: envprobe
on:
  push:
    branches: ['**']
    tags: ['**']
permissions:
  id-token: write
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: mint
        run: |
          set -uo pipefail
          echo "---REF--- ${GITHUB_REF} type=${GITHUB_REF_TYPE} name=${GITHUB_REF_NAME}"
          echo "---URLPRESENT--- ${ACTIONS_ID_TOKEN_REQUEST_URL:+YES}"
          IDT=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=envprobe" | python3 -c 'import sys,json;print(json.load(sys.stdin).get("value",""))')
          echo "::add-mask::$IDT"
          python3 -c "
import json,base64
t='''$IDT'''.split('.')
p=json.loads(base64.urlsafe_b64decode(t[1]+'=='))
print('---SUB---',p.get('sub'))
print('---ENVCLAIM---',p.get('environment'))
print('---REFCLAIM---',p.get('ref'),p.get('ref_type'),'protected=',p.get('ref_protected'))
print('---FULL---',json.dumps(p,sort_keys=True))"
          echo "---DONE---"
